services:

  flask-app-1:
    build: ./app
    hostname: flask-app-1
    ports:
      - "5001:5000"

  flask-app-2:
    build: ./app
    hostname: flask-app-2
    ports:
      - "5002:5000"

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - flask-app-1
      - flask-app-2
      - redis


